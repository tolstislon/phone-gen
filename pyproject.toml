[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "phone_gen"
dynamic = ["version"]
description = "International phone number generation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
authors = [{ name = "tolstislon", email = "tolstislon@gmail.com" }]
keywords = ["testing", "test-data", "phone-number", "phone", "test-data-generator"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Testing",
    "Topic :: Communications :: Telephony",
]
dependencies = ["string-gen>=1.0.0"]

[project.urls]
Homepage = "https://github.com/tolstislon/phone-gen"

[project.scripts]
phone-gen = "phone_gen.cli:main"

[dependency-groups]
dev = [
    "phonenumbers==9.0.39",
    "pytest<9; python_version < '3.10'",
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest-cov<7; python_version < '3.9'",
    "pytest-cov>=7,<7.1; python_version == '3.9'",
    "pytest-cov==7.1.0; python_version >= '3.10'",
    "requests==2.34.2; python_version >= '3.11'",
    "ruff==0.15.20",
]

[tool.setuptools]
packages = ["phone_gen"]

[tool.setuptools_scm]
version_file = "phone_gen/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=phone_gen", "-l"]
markers = ["phonenumbers: Dependency on phonenumbers"]

[tool.coverage.run]
omit = ["phone_gen/__version__.py"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 120
target-version = "py38"
exclude = [".git", ".pytest_cache", ".idea", ".github"]

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "COM", # flake8-commas
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # Pyflakes
    "FURB", # refurb
    "I", # isort
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "N", # pep8-naming
    "PERF", # Perflint
    "PGH", # pygrep-hooks
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "S", # flake8-bandit
    "T20", # flake8-print
    "UP", # pyupgrade
    "PIE", # flake8-pie
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "FLY", # flynt
    "PL", # Pylint
    "RSE", # flake8-raise
    "ERA", # eradicate (Закомменченый код)
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "DTZ", # flake8-datetimez
    "INT", # flake8-gettext
    "TC", # flake8-type-checking
    "W", # pycodestyle (warning)
    "PLR", # Refactor
    "PLW", # Warning
    "TRY", # Warning
    "ASYNC", # flake8-async
    "T10", # flake8-debugger
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "LOG", # flake8-logging
    "G", # flake8-logging-format
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "TID", # flake8-tidy-imports
    "PLE", # Pylint Error
]
ignore = [
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposesStandard pseudo-random generators are not suitable for cryptographic purposes
    "D212", # multi-line-summary-first-line (conflicts rules)
    "D203", # one-blank-line-before-class (conflicts rules)
    "COM812", # conflicts rules
    "ISC001", # conflicts rules
    "N818", # Exception name `{exception}` should be named with an Error suffix
    "LOG015", # call on root logger
    "EM102", # Exception must not use an f-string literal, assign to variable first
    "TRY003", # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "D103", "ANN201", "D100", "S605", "S607"]
"patterns.py" = ["E501", "D205"]
"_phone_number.py" = ["FBT001", "FBT002"]
"dev_tools/*.py" = ["D103", "S314", "D102", "D107", "D101", "ICN001", "D100", "S607", "S603", "ANN204"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-row-type = "tuple"
parametrize-values-type = "tuple"
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
line-ending = "lf"
